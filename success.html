<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>WebKitty - Islem Basarili</title>
  <link rel="icon" href="./includes/assets/icons/favicon.ico" type="image/x-icon">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111827;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background-color: #1f2937;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .badge {
      display: inline-block;
      background-color: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .ps-btn-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px auto 28px;
    }

    .ps-btn-svg {
      width: 136px;
      height: 136px;
      filter: drop-shadow(0 0 22px rgba(59, 130, 246, 0.45));
      animation: psPulse 2.2s ease-in-out infinite;
    }

    @keyframes psPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.45));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 30px rgba(96, 165, 250, 0.75));
      }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f9fafb;
    }

    .subtitle {
      font-size: 18px;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .ps-key {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 6px;
      margin: 0 2px;
    }

    .return-btn {
      display: inline-block;
      background-color: #374151;
      color: #e5e7eb;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: background-color 0.2s ease;
    }

    .return-btn:hover {
      background-color: #4b5563;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge" id="success-badge">Jailbreak Basarili</div>

    <!-- DualShock / PS4 "PS" Button Graphic -->
    <div class="ps-btn-wrap" aria-label="PS Tusu">
      <svg class="ps-btn-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="psBtnBg" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#374151" />
            <stop offset="65%" stop-color="#111827" />
            <stop offset="100%" stop-color="#030712" />
          </radialGradient>
          <linearGradient id="psBtnRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#2563eb" />
          </linearGradient>
        </defs>
        <!-- Outer glowing ring -->
        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#psBtnRing)" stroke-width="3.5" opacity="0.85" />
        <!-- Circular PS button body -->
        <circle cx="60" cy="60" r="48" fill="url(#psBtnBg)" stroke="#4b5563" stroke-width="2" />
        <!-- Subtle top highlight -->
        <ellipse cx="60" cy="34" rx="28" ry="12" fill="#ffffff" opacity="0.07" />
        <!-- PlayStation logo inside the button -->
        <g transform="translate(32, 34) scale(1.75)" fill="#e5e7eb">
          <path d="M0.69116 21.9548C-0.506476 22.7935 -0.284724 24.2384 2.44769 25.1419C5.18011 26.0455 8.35603 26.2323 11.1505 25.729C11.0707 25.729 11.3102 25.729 11.1505 25.729V22.8774L8.43588 23.8C7.39792 24.1355 6.35997 24.2194 5.32202 23.9677C4.5236 23.7161 4.68328 23.2129 5.64139 22.7935L11.1505 20.7806V17.6774L3.48565 20.4452C2.52754 20.7806 1.56943 21.2839 0.69116 21.9548ZM19.2146 9.37419V17.5097C22.4881 19.1871 25.0431 17.5097 25.0431 13.1484C25.0431 8.70323 23.5261 6.69032 19.1348 5.09677C16.8193 4.25806 14.4241 3.50323 12.0288 3V27.2387L17.6178 29V8.61935C17.6178 7.69677 17.6178 7.02581 18.2565 7.27742C19.1348 7.52903 19.2146 8.45161 19.2146 9.37419ZM29.5941 20.0258C27.2787 19.1871 24.8036 18.8516 22.4083 19.1032C21.0779 19.1906 19.8294 19.5869 18.5759 20.0258V23.2968L23.7656 21.2839C24.8036 20.9484 25.8415 20.8645 26.8795 21.1161C27.6779 21.3677 27.5182 21.871 26.5601 22.2903L18.5759 25.3935V28.5806L29.5941 24.3032C30.3925 23.9677 31.1111 23.5484 31.7499 22.8774C32.3088 22.0387 32.0692 20.8645 29.5941 20.0258Z" />
        </g>
      </svg>
    </div>

    <h1 id="success-title">Islem Basarili!</h1>
    <p class="subtitle" id="success-desc">
      <span class="ps-key">"PS"</span> tusuna basarak cikin.
    </p>

    <a id="return-btn" class="return-btn" href="./">Ana Sayfaya Don</a>
  </main>

  <script src="./includes/js/storage.js"></script>
  <script src="./includes/js/testMode.js"></script>
  <script>
    (function () {
      var returnBtn = document.getElementById('return-btn');
      if (returnBtn && typeof mainPage !== 'undefined') {
        returnBtn.href = mainPage;
      }

      var currentLang = storage.getString('language', 'tr');
      if (currentLang === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'WebKitty - Success';
        document.getElementById('success-badge').textContent = 'Jailbreak Successful';
        document.getElementById('success-title').textContent = 'Process Completed!';
        document.getElementById('success-desc').innerHTML = 'Press the <span class="ps-key">"PS"</span> button to exit.';
        if (returnBtn) returnBtn.textContent = 'Return to Main Page';
      }
    })();
  </script>
</body>

</html>
