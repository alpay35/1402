<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>WebKitty - Onbellekleme</title>
    <meta name="author" content="ArabPixel">
    <link rel="stylesheet" href="./includes/css/colors/default.css">
    <link rel="stylesheet" href="./includes/css/layouts/index.css">
    <link rel="stylesheet" href="./includes/css/cache.css">
</head>

<body class="bg-gray-900 text-white">
    <main class="mainContainer">
        <section class="cache-screen">
            <div class="cache-title">WebKitty Onbellekleniyor</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="cache-subtitle" id="cacheStatus">Hazirlaniyor...</div>
        </section>
        <div class="absolute bottom-10 text-center w-full">Surum Tabanli Onbellekleme Sistemi</div>
    </main>

    <iframe id="cacheFrame" src="about:blank"></iframe>

    <script src="./includes/js/storage.js"></script>
    <script src="./includes/js/testMode.js"></script>
    <script src="./includes/js/firmware.js"></script>
    <script>
        var fwVersion = getPs4FwVersion();
        var targetPage = getCachePage(fwVersion);

        var statusEl = document.getElementById('cacheStatus');
        var fillEl = document.getElementById('progressFill');
        var frame = document.getElementById('cacheFrame');

        // Listen for postMessages from the iframe (iframe_cache.js)
        window.addEventListener('message', function (event) {
            var data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'CACHE_CHECKING') {
                statusEl.textContent = 'Guncellemeler kontrol ediliyor...';

            } else if (data.type === 'CACHE_DOWNLOADING') {
                statusEl.textContent = 'Yeni dosyalar onbellege aliniyor...';

            } else if (data.type === 'CACHE_PROGRESS') {
                if (data.percent >= 0) {
                    fillEl.style.width = data.percent + '%';
                    statusEl.textContent = 'Guncelleme onbellege aliniyor... ' + data.percent + '%';
                } else if (data.loaded && data.total) {
                    statusEl.textContent = 'Guncelleme onbellege aliniyor... (' + data.loaded + ' / ' + data.total + ')';
                } else {
                    statusEl.textContent = 'Guncellemeler onbellege aliniyor...';
                }

            } else if (data.type === 'CACHE_COMPLETE') {
                fillEl.style.width = '100%';
                statusEl.textContent = 'Onbellekleme tamamlandi! Yonlendiriliyor...';
                setTimeout(function () {
                    window.location.replace(mainPage);
                }, 1000);

            } else if (data.type === 'CACHE_UPDATED') {
                fillEl.style.width = '100%';
                statusEl.textContent = 'En son surume guncellendi! Yonlendiriliyor...';
                setTimeout(function () {
                    window.location.replace(mainPage);
                }, 1000);

            } else if (data.type === 'CACHE_UP_TO_DATE') {
                fillEl.style.width = '100%';
                statusEl.textContent = 'Zaten guncel! Yonlendiriliyor...';
                setTimeout(function () {
                    window.location.replace(mainPage);
                }, 800);

            } else if (data.type === 'CACHE_ERROR') {
                var reason = data.reason || 'Bilinmeyen hata';
                statusEl.textContent = 'Onbellek hatasi: ' + reason;
                setTimeout(function () {
                    window.location.replace(mainPage);
                }, 3000);
            }
        }, false);

        // Load the firmware-based cache page into the hidden iframe
        statusEl.textContent = (fwVersion || 'bilinmeyen') + ' surumu icin onbellekleme baslatiliyor...';
        frame.src = targetPage;
    </script>
</body>

</html>
